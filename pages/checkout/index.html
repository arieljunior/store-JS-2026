<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja JS | Checkout</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a class="logo" href="../../index.html">Loja JS</a>
            <nav class="nav">
                <a href="../../index.html">Início</a>
                <a href="../products/index.html">Produtos</a>
                <a href="../cart/index.html">Carrinho<span class="badge" data-cart-count>0</span></a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Checkout</h1>

        <div class="checkout-layout">
            <!-- Visual only: no form action, no submit handling -->
            <section class="panel">
                <h2>Dados de entrega</h2>

                <div class="field">
                    <label for="name">Nome completo</label>
                    <input id="name" type="text" placeholder="Maria da Silva">
                </div>
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" placeholder="maria@email.com">
                </div>
                <div class="field">
                    <label for="address">Endereço</label>
                    <input id="address" type="text" placeholder="Rua, número, complemento">
                </div>
                <div class="row">
                    <div class="field">
                        <label for="city">Cidade</label>
                        <input id="city" type="text" placeholder="Rio de Janeiro">
                    </div>
                    <div class="field">
                        <label for="zip">CEP</label>
                        <input id="zip" type="text" placeholder="00000-000">
                    </div>
                </div>

                <h2>Pagamento</h2>
                <div class="field">
                    <label for="payment">Forma de pagamento</label>
                    <select id="payment">
                        <option>Pix</option>
                        <option>Cartão de crédito</option>
                        <option>Boleto</option>
                    </select>
                </div>
            </section>

            <aside class="panel">
                <h2>Resumo do pedido</h2>
                <div data-order-items></div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span data-order-total>R$ 0,00</span>
                </div>
                <a class="btn" href="../success/index.html" data-confirm-link>Confirmar pedido</a>
            </aside>
        </div>
    </main>

    <footer class="footer">Loja JS — projeto de estudo com FakeStore API</footer>

    <script type="module" src="./index.js"></script>
</body>
</html>
