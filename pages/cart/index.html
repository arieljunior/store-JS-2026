<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja JS | Carrinho</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a class="logo" href="../../index.html">Loja JS</a>
            <nav class="nav">
                <a href="../../index.html">Início</a>
                <a href="../products/index.html">Produtos</a>
                <a href="./index.html" aria-current="page">Carrinho<span class="badge" data-cart-count>0</span></a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Carrinho</h1>

        <div class="cart-layout">
            <div class="cart-items" data-cart-items></div>

            <aside class="panel" data-cart-summary>
                <h2>Resumo</h2>
                <div class="summary-row">
                    <span>Itens</span>
                    <span data-cart-count-text>0</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span data-cart-total>R$ 0,00</span>
                </div>
                <a class="btn" href="../checkout/index.html" data-checkout-link>Finalizar compra</a>
            </aside>
        </div>
    </main>

    <footer class="footer">Loja JS — projeto de estudo com FakeStore API</footer>

    <script type="module" src="./index.js"></script>
</body>
</html>
